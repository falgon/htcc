executables:
  htcc:
    main:                Main.hs
    source-dirs:         app
    generated-other-modules:
    - Paths_htcc
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -Wall
      #- -Werror
    - -O2
    dependencies:
    - htcc
    - directory
    - filepath
    - process
    - stm
    - template-haskell
    - unix

