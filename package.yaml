    - Tests.SubProcTests.LinkFuncStdOut
    - Tests.SubProcTests.StatementEqual
    - Tests.Utils
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -Wall
    - -O2
    dependencies:
    - htcc
    - HUnit
    - turtle
    - text
    - directory
    - time
    - foldl
    - hspec
    - hspec-core
    - hspec-contrib
    - filepath
    - dhall-json
    - dhall-yaml
    - process
    - unix
    - utf8-string

benchmarks:
